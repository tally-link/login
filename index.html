<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting… — Tally-Link</title>
<meta name="description" content="Tally-Link login. Redirecting to the Tally-Link web app.">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://tally-link.swiftcom-web.workers.dev/">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23457b9d'/%3E%3Ctext x='32' y='44' font-family='system-ui,sans-serif' font-size='34' font-weight='700' fill='%23fff' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E">
<meta http-equiv="refresh" content="0; url=https://tally-link.swiftcom-web.workers.dev/">
<script>
  (function () {
    var TARGET = 'https://tally-link.swiftcom-web.workers.dev/';
    // Keep any ?query and #hash the visitor arrived with.
    var dest = TARGET + window.location.search + window.location.hash;
    // replace() so the redirect page does not stay in the back history.
    window.location.replace(dest);
  })();
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: radial-gradient(circle at 50% 0%, #16233f 0%, #0f172a 60%);
    color: #cbd5e1;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    text-align: center;
  }
  .card { max-width: 400px; width: 100%; }
  .logo {
    width: 76px;
    height: 76px;
    border-radius: 18px;
    background: #457b9d;
    color: #fff;
    font-size: 2.2rem;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1.3rem;
    box-shadow: 0 10px 30px rgba(69, 123, 157, 0.35);
  }
  h1 { color: #fff; font-size: 1.5rem; font-weight: 700; margin-bottom: 0.35rem; }
  p { color: #94a3b8; font-size: 0.95rem; margin-bottom: 1.6rem; }
  .spinner {
    width: 26px;
    height: 26px;
    margin: 0 auto 1.6rem;
    border: 3px solid #334155;
    border-top-color: #7dd3fc;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn {
    display: inline-block;
    padding: 0.8rem 1.6rem;
    border-radius: 8px;
    background: #457b9d;
    color: #fff;
    font-weight: 600;
    font-size: 0.95rem;
    text-decoration: none;
    transition: opacity 0.15s ease;
  }
  .btn:hover { opacity: 0.9; }
  .note { margin: 1.4rem 0 0; font-size: 0.8rem; color: #64748b; }
  a { color: #7dd3fc; text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>

  <main class="card">
    <div class="logo">T</div>
    <h1>Signing you in…</h1>
    <p>Taking you to the Tally-Link web app.</p>
    <div class="spinner" aria-hidden="true"></div>
    <a class="btn" href="https://tally-link.swiftcom-web.workers.dev/">Continue to Tally-Link</a>
    <p class="note">Not redirected? <a href="https://tally-link.swiftcom-web.workers.dev/">Tap here</a>.</p>
  </main>

</body>
</html>
